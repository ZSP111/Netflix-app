name: Deploy to GitHub Pages

# Works with either GitHub Pages setting (Settings -> Pages -> Source):
#   - "Deploy from a branch" (gh-pages / root)  -> served from the gh-pages branch
#   - "GitHub Actions"                          -> served by the `pages` job below

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      # Single-page app: serve index.html for unknown paths (e.g. /browse on refresh)
      - run: cp dist/index.html dist/404.html
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  pages:
    needs: build
    runs-on: ubuntu-latest
    # Only succeeds when Pages Source is "GitHub Actions"; never fails the run.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
